<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Afrivogue | Fashion, Culture & Lifestyle Through an African Lens</title>
    <meta
      name="description"
      content="Afrivogue is a fashion, culture and lifestyle magazine for Africa and its diaspora. Stories, editorials, forecasts and a community of people shaping what the world wears next."
    />
    <meta name="author" content="Afrivogue" />
    <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120e0b" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:site_name" content="Afrivogue" />
    <meta property="og:title" content="Afrivogue | Fashion, Culture & Lifestyle Through an African Lens" />
    <meta
      property="og:description"
      content="Stories, editorials and forecasts from Africa and its diaspora, curated by people who live the culture."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://afrivogue.com/" />
    <meta property="og:image" content="https://afrivogue.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Afrivogue | Fashion, Culture & Lifestyle Through an African Lens" />
    <meta
      name="twitter:description"
      content="Stories, editorials and forecasts from Africa and its diaspora, curated by people who live the culture."
    />
    <meta name="twitter:image" content="https://afrivogue.com/og-image.jpg" />

    <!-- Light is the default; apply a saved dark choice before first paint to avoid a flash. -->
    <script>
      try {
        if (localStorage.getItem("afrivogue_theme") === "dark") document.documentElement.classList.remove("light");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
