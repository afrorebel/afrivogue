# Builds the site and uploads it to Hostinger on every push to main.
#
# One-time setup (GitHub repo > Settings > Secrets and variables > Actions):
#   HOSTINGER_FTP_SERVER     e.g. ftp.afrivogue.com (hPanel > Files > FTP Accounts)
#   HOSTINGER_FTP_USERNAME   FTP username
#   HOSTINGER_FTP_PASSWORD   FTP password
#   HOSTINGER_FTP_DIR        optional, defaults to public_html/
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.HOSTINGER_FTP_SERVER != '' && secrets.HOSTINGER_FTP_USERNAME != '' && secrets.HOSTINGER_FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: FTP secrets missing
        if: env.HAS_FTP != 'true'
        run: echo "::warning::Add the HOSTINGER_FTP_* secrets to deploy. The build passed; nothing was uploaded."

      - name: Upload to Hostinger
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR || 'public_html/' }}
